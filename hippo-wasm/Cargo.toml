[package]
name = "hippo-wasm"
version.workspace = true
edition = "2021"
license.workspace = true
description = "WebAssembly bindings for Hippo search engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Error handling for WASM
console_error_panic_hook = "0.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"

# Core types and utilities
chrono = { workspace = true }
# Need js feature for WASM random number generation
uuid = { version = "1", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }

# Logging for WASM
tracing = { workspace = true }
tracing-wasm = "0.2"

# We only need the models and search logic, not storage/indexing
# These dependencies are WASM-compatible
regex = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# NOTE: Release size tuning (opt-level="z", lto, codegen-units=1, panic="abort",
# strip) is NOT defined here on purpose. `[profile.*]` is only honored in the
# root workspace manifest; a copy in a non-root member is silently ignored by
# Cargo and emits a "profiles for non-root package will be ignored" warning on
# every `cargo build --workspace`. The size-optimized wasm build is produced via
# wasm-pack, whose own release profile is configured below.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
